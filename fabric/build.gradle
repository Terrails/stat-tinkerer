plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    mods {
        main {
            sourceSet project.sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "TerraformersMC Maven"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Common
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric"))

    // Night Config
    api(include("com.electronwill.night-config:core:${nightconfig_version}"))
    api(include("com.electronwill.night-config:toml:${nightconfig_version}"))
    
    // Optional Dependencies
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

remapJar {
    input.set shadowJar.archiveFile
}

tasks.register('publishProduction') {
    dependsOn([tasks.build])
    finalizedBy([tasks.modrinth, tasks.publishCurseForge])
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${project.modrinth_id}"
    versionNumber = "${project.version}"
    versionName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    uploadFile = tasks.remapJar.getArchiveFile().get()
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
    }
    changelog = rootProject.file("CHANGELOG.md").text
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    disableVersionDetection()

    def mainFile = upload(project.curseforge_id, tasks.remapJar.getArchiveFile().get())
    mainFile.displayName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    mainFile.releaseType = "release"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion("Client", "Server", project.minecraft_version)
    mainFile.addRequirement("fabric-api")
    mainFile.addModLoader("fabric")
}
