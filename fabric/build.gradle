plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    mods {
        main {
            sourceSet project.sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }

    nestJars(tasks.named("shadowJar", Jar.class), configurations.named("include"))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }

    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

repositories {
    maven {
        name = "TerraformersMC Maven"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // Fabric
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Common
    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric"))

    // Night Config
    api(include("com.electronwill.night-config:core:${project.nightconfig_version}"))
    api(include("com.electronwill.night-config:toml:${project.nightconfig_version}"))
    
    // Optional Dependencies
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation("maven.modrinth:tough-as-nails:${project.toughasnails_version}-fabric")
    runtimeOnly("maven.modrinth:glitchcore:${project.glitchcore_version}-fabric")
    runtimeOnly("net.jodah:typetools:0.6.3")
}

processResources {
    var expandProps = [
            mod_version                 : project.version,
            min_minecraft_version       : project.min_minecraft_version,
            min_fabric_loader_version   : project.min_fabric_loader_version,
            min_fabric_api_version      : project.min_fabric_api_version
    ]

    inputs.properties expandProps
    filesMatching("fabric.mod.json") {
        expand expandProps
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

tasks.register('publishProduction') {
    dependsOn([tasks.build])
    finalizedBy([tasks.modrinth, tasks.publishCurseForge])
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${project.modrinth_id}"
    versionNumber = "${project.version}"
    versionName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    uploadFile = tasks.shadowJar.getArchiveFile().get()
    gameVersions = project.supported_minecraft_versions.split(",").toList()
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
    }
    changelog = rootProject.file("CHANGELOG.md").text
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    disableVersionDetection()

    def mainFile = upload(project.curseforge_id, tasks.shadowJar.getArchiveFile().get())
    mainFile.displayName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    mainFile.releaseType = "release"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion("Client", "Server", *project.supported_minecraft_versions.split(","))
    mainFile.addRequirement("fabric-api")
    mainFile.addModLoader("fabric")
}
