plugins {
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.+' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = "terrails.colorfulhearts"
    version = project.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "stattinkerer-${project.name}-${project.minecraft_version}"
    }

    architectury {
        compileOnly()
        injectInjectables = false
    }

    jar {
        archiveClassifier = "raw"
    }

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
    }
}
