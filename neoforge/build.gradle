plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    mods {
        main {
            sourceSet project.sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }

    nestJars(tasks.named("shadowJar", Jar.class), configurations.named("include"))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }

    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    // Common
    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge"))

    // Optional Dependencies
    implementation("maven.modrinth:tough-as-nails:${project.toughasnails_version}-neoforge")
    runtimeOnly("maven.modrinth:glitchcore:${project.glitchcore_version}-neoforge")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

tasks.register('publishProduction') {
    dependsOn([tasks.build])
    finalizedBy([tasks.modrinth, tasks.publishCurseForge])
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${project.modrinth_id}"
    versionNumber = "${project.version}"
    versionName = "[NeoForge] ${project.minecraft_version}-v${project.version}"
    uploadFile = tasks.shadowJar.getArchiveFile().get()
    gameVersions = [project.minecraft_version]
    loaders = ["neoforge"]
    changelog = rootProject.file("CHANGELOG.md").text
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    disableVersionDetection()

    def mainFile = upload(project.curseforge_id, tasks.shadowJar.getArchiveFile().get())
    mainFile.displayName = "[NeoForge] ${project.minecraft_version}-v${project.version}"
    mainFile.releaseType = "release"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion("Client", "Server", project.minecraft_version)
    mainFile.addModLoader("neoforge")
}
